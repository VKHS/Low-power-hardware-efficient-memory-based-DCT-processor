[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dct8"
version = "1.0.0"
description = "Bit-accurate models of the low-power hardware-efficient memory-based DCT processor"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdolvahab Khalili Sadaghiani" }]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7", "scikit-image>=0.19"]
figures = ["matplotlib>=3.5", "scikit-image>=0.19"]

[tool.setuptools]
packages = ["dct8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
